name: Predictive Maintenance MLOps Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate-prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Register and validate dataset
        run: python src/validate_dataset.py

      - name: Clean data and create train/test splits
        run: python src/prepare_data.py

      - name: Upload train/test splits as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: train-test-splits
          path: |
            data/train.csv
            data/test.csv

  train:
    needs: validate-prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download train/test splits artifact
        uses: actions/download-artifact@v4
        with:
          name: train-test-splits
          path: data/

      - name: Tune, evaluate and save best model
        run: python src/train.py

      - name: Upload trained model artifact
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: |
            models/best_model.joblib
            models/metrics.json

      - name: Commit best model and experiment log
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/best_model.joblib models/metrics.json
          if ! git diff --cached --quiet; then
            git commit -m "Update predictive maintenance model [skip ci]"
            git push
          fi
